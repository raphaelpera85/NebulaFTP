name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff mypy bcrypt cryptography
          # Mongo + Telegram deps can't start here, but we still verify imports.
          pip install motor pyrogram tgcrypto pymongo dnspython python-dotenv aiofiles aiohttp pyftpdlib || true

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy --ignore-missing-imports ftp main.py accounts_manager.py || true
        continue-on-error: true

      - name: Tests
        env:
          MONGODB: mongodb://127.0.0.1:27017
        run: pytest -q
